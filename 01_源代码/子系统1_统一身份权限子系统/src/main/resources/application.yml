# ==========================================================
# 身份权限子系统 8081 —— jar 内默认配置
# 只放"跟节点无关"的默认值：端口、编码、ORM、JWT 有效期。
# 数据库地址/账号、jwt.secret、internal.token 一律由外置 config/ 提供，
# 源码与本文件内不得出现 localhost、固定 IP、任何密钥。
# 启动命令：
#   java -jar auth-service-1.0.0.jar --spring.config.additional-location=./config/
# 本机开发额外追加：--spring.profiles.active=local
# ==========================================================
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: auth-service
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 全局鉴权配置（契约 1.3）：secret 由外置 config/ 注入，此处只放有效期
jwt:
  expire-seconds: 7200

logging:
  level:
    com.campus.studyroom.auth: info
